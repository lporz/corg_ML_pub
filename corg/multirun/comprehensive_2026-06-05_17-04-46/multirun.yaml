hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/comprehensive_${now:%Y-%m-%d_%H-%M-%S}
    subdir: run_${hydra:job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.sweep.dir=./multirun/comprehensive_${now:%Y-%m-%d_%H-%M-%S}
    - hydra.sweep.subdir=run_${hydra:job.num}
    - hydra.mode=MULTIRUN
    task:
    - model.hidden_layers=[64,32,16],[128,64,32]
    - model.dropout_rate=0.1,0.2,0.3
    - training.batch_size=32,64
    - training.learning_rate=0.0005,0.001,0.002
    - spatial_weighting.method=density,kde
    - spatial_weighting.radius=0.15,0.2,0.25
  job:
    name: corg_train
    chdir: null
    override_dirname: model.dropout_rate=0.1,0.2,0.3,model.hidden_layers=[64,32,16],[128,64,32],spatial_weighting.method=density,kde,spatial_weighting.radius=0.15,0.2,0.25,training.batch_size=32,64,training.learning_rate=0.0005,0.001,0.002
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/g/g260124/corg-prediction_pub/corg
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/g/g260124/corg-prediction_pub/corg/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
seed: 42
data:
  train_file: ../data/Corg_BS.csv
  test_file: ../data/Corg_BS_test_points_FPS_constr.dat
  prediction_file: ../data/BS_out_pnts_500m.csv
  n_test_points: 100
spatial_weighting:
  use_spatial_weighting: true
  method: density
  radius: 0.25
  min_weight: 0.1
  max_weight: 3.0
  power: 1.0
model:
  hidden_layers:
  - 128
  - 64
  - 32
  dropout_rate: 0.1
training:
  batch_size: 32
  learning_rate: 0.002
  max_epochs: 300
  early_stopping_patience: 20
  min_learning_rate: 1.0e-06
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 10
device:
  use_cuda: true
output:
  save_model: true
  model_save_path: models/corg_model.pth
  save_plots: true
  plots_save_path: plots/corg_model_performance.png
  scaler_path: misc/corg_scaler.pkl
  output_file: outputs/corg_BS_out_pnts_500m_predictions_optparam.csv
  output_plot: plots/corg_prediction_optparam.png
  confidence_plot: plots/corg_confidence_map_optparam.png
